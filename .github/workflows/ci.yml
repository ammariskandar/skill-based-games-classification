name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# SBGC-108 — least-privilege default: read-only token scope for every job.
# A job that genuinely needs write access declares its own elevated
# `permissions:` block; none of the CI jobs do.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check --workspace=apps/frontend

      - name: Lint (ESLint)
        run: npm run lint:frontend

      - name: Type-check (astro check)
        run: npm run check:frontend

      - name: Test (frontend)
        run: npm run test:frontend

      - name: Design-reference isolation check
        run: npm run check:design-reference

      - name: Build (astro build)
        run: npm run build:frontend

  backend:
    name: Backend (Django SQLite)
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-dummy-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Create virtual environment
        run: python -m venv apps/backend/.venv

      - name: Install dependencies
        run: apps/backend/.venv/bin/python -m pip install -r apps/backend/requirements.txt

      - name: Lint (Ruff)
        run: apps/backend/.venv/bin/ruff check apps/backend

      - name: Check formatting (Ruff)
        run: apps/backend/.venv/bin/ruff format --check apps/backend

      - name: Type check (BasedPyright)
        run: npm run typecheck:backend

      - name: System check (Django)
        run: apps/backend/.venv/bin/python apps/backend/manage.py check

      - name: Test (backend SQLite)
        run: npm run test:backend

  backend-postgresql:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sbgc_ci
          POSTGRES_PASSWORD: sbgc_ci_pass
          POSTGRES_DB: sbgc_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://sbgc_ci:sbgc_ci_pass@localhost:5432/sbgc_ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Create virtual environment
        run: python -m venv apps/backend/.venv

      - name: Install dependencies
        run: apps/backend/.venv/bin/python -m pip install -r apps/backend/requirements.txt

      - name: Run PostgreSQL tests
        run: npm run test:backend:postgresql
