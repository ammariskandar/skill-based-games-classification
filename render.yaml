# SBGC-43 — Render Blueprint for the Django backend web service.
# https://render.com/docs/blueprint-spec
#
# This defines one Python web service.  The Neon PostgreSQL database is
# provisioned separately through the Neon dashboard — do not define a
# Render database resource here.
#
# No real credentials or secrets are stored in this file.
# Deployment has not been verified against a live Render service.

services:
  - type: web
    # Must match the live Render service name — Render derives the default
    # <service-name>.onrender.com host from this field, and the blueprint would
    # otherwise provision a second service under a different hostname.
    name: skill-based-games-classification
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/backend
    buildCommand: ../../scripts/backend-build.sh
    preDeployCommand: ../../scripts/backend-migrate.sh
    startCommand: ../../scripts/backend-start.sh
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # SBGC-185 — direct (non-pooled) Neon endpoint for the pre-deploy migration
      # and createcachetable.  scripts/backend-migrate.sh refuses a -pooler host.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_URL_PATH
        sync: false
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: STEAM_WEB_API_KEY
        sync: false
      # SBGC-104 — reCAPTCHA v3 secret; production refuses to boot without it.
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # SBGC-106 — reCAPTCHA v3 site key; renders the admin-login challenge.
      - key: RECAPTCHA_SITE_KEY
        sync: false
      # SBGC-186 — dual-superuser quota handles.  production.py fails fast when
      # any of the three is empty or they are not mutually distinct.
      - key: DJANGO_OWNER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_1
        sync: false
      - key: DJANGO_SUPERUSER_2
        sync: false
      # SBGC-223 — public frontend origin for Admin profile hyperlinks.
      - key: PUBLIC_SITE_URL
        sync: false
      # Sender address for operational alert emails.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # SBGC-239 — Resend SMTP credential.  Production derives
      # smtp.resend.com:587 with the "resend" username from this key alone, and
      # refuses to boot when neither it nor EMAIL_HOST_PASSWORD is present.
      - key: RESEND_API_KEY
        sync: false
      # SBGC-239 — envelope sender for Django error mail.
      - key: SERVER_EMAIL
        sync: false
      # SBGC-104 — TLS toggle for PostgreSQL (defaults to enabled).
      - key: DB_SSL_REQUIRE
        value: "true"
      # SBGC-105 — full-strength HSTS (1 year).  Lower temporarily only to
      # stage an HSTS rollout; preload + includeSubDomains are enabled.
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: WEB_CONCURRENCY
        value: "2"
      # SBGC-196 — pin the Python runtime (audit R4-16): Render builds and
      # runs on exactly this patch version regardless of platform defaults.
      - key: PYTHON_VERSION
        value: "3.12.9"
