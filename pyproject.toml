# Repository Python baseline: >=3.12 (SBGC-108).
# pyproject.toml is the shared tool config (ruff); there is no [project]
# package definition — runtime deps are pinned in apps/backend/requirements.txt
# and the CI canonical runtime is Python 3.12 (config/settings + pyright target).
#
# Django constraint (SBGC-108): the project tracks the supported window
# >=5.2,<6.1 — 5.2 LTS and the current 6.0 feature release (exact patch pins in
# apps/backend/requirements.txt).  <6.1 blocks unvetted minor upgrades where
# deprecated APIs are removed and django-ninja compatibility is unverified.

[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length matching Black's default
line-length = 88

# Exclude generated and dependency directories
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.pyc",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "S608",  # flake8-bandit — hardcoded SQL built from untrusted strings
]      

ignore = [
    "DJ001",  # avoid false positives before models exist
    "D",      # skip docstring rules for now
]

[tool.ruff.lint.per-file-ignores]
# Questionnaire registry data: the question/answer prose is intentionally long
# and must remain single string literals so it mirrors the TypeScript registry
# byte-for-byte.
"apps/backend/classifications/questionnaire/registry/v1/*.py" = ["E501"]

[tool.ruff.format]
# Match Black-style formatting
quote-style = "double"
indent-style = "space"
